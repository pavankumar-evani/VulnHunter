<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VulnHunter</title>
  <link rel="icon" type="image/svg+xml" href="/static/brand/favicon.svg">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-column">
      <header class="topbar">
        <button type="button" class="sidebar-toggle" id="sidebar-toggle"
          aria-label="Collapse sidebar" aria-pressed="false" title="Collapse sidebar"></button>
        <h1 class="page-title" id="page-title">VulnHunter</h1>
        <div class="topbar-search" id="topbar-search"></div>
        <div class="topbar-extra" id="topbar-extra"></div>
        <div class="topbar-notifications" id="topbar-notifications"></div>
        <div class="topbar-account" id="topbar-account"></div>
      </header>
      <main class="content">
        <div class="flash-container" id="flash-container"></div>
        <div id="app"><div class="empty-state">Loading…</div></div>
      </main>
    </div>
  </div>
  <div id="modal-root"></div>
  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
