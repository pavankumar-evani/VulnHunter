# Finding: FIND-1 - PrintNightmare RCE (CVE-2021-34527) on WIN-DC01
# Risk tier: needs-change-approval - WIN-DC01 is a domain controller.
# CHANGE APPROVAL REQUIRED before running - see REMEDIATION_PLAN.md for why.
# Rollback: restore from pre-patch VM/config snapshot, or re-enable the Print
# Spooler service if disabling it breaks a dependent print workflow.
#
# Tenable's own "Solution" field names the specific fix (KB5004945), so this
# playbook applies it directly rather than a generic Windows Update sweep.
# Verify KB5004945 is still the currently-recommended KB for this OS build
# against Microsoft's advisory before running - vendors sometimes supersede
# KBs with a later cumulative update.
---
- name: "FIND-1: Remediate PrintNightmare (CVE-2021-34527) on WIN-DC01"
  hosts: "{{ target_host | default('WIN-DC01') }}"
  gather_facts: false

  tasks:
    - name: Check current Print Spooler service state (pre-change baseline)
      ansible.windows.win_service_info:
        name: Spooler
      register: spooler_before

    - name: Report pre-change spooler state
      ansible.builtin.debug:
        msg: "Spooler service before change: {{ spooler_before.services }}"

    - name: Install KB5004945 (PrintNightmare fix) via Windows Update
      ansible.windows.win_updates:
        category_names:
          - SecurityUpdates
        server_selection: default
      register: update_result

    - name: Reboot if the update requires it
      ansible.windows.win_reboot:
      when: update_result.reboot_required | default(false)

    # Alternative / defense-in-depth if printing isn't required on this host at
    # all - uncomment only after confirming with the service owner:
    # - name: Disable Print Spooler service (only if printing is not required here)
    #   ansible.windows.win_service:
    #     name: Spooler
    #     start_mode: disabled
    #     state: stopped
