# Configurable priority rules for VulnHunter's remediation queue.
#
# This is read by remediation/config/priority_engine.py, which the DASHBOARD uses to
# live-recompute priority/SLA for every finding using whatever weights are configured
# here - independent of whatever REMEDIATION_PLAN.md's static snapshot says. That's
# deliberate: an admin can retune these weights and see the queue reorder immediately,
# without re-running the full Claude Code pipeline. See
# remediation/config/README.md for how this relates to remediation-planner's own
# priority logic (they are two related but distinct things today).
#
# Edit this file directly, or use the dashboard's /priority-rules page (a form-based
# editor that writes back to this same file).

# How many days a finding has to be remediated, per priority tier, before it's
# considered SLA-breached. Tune these to your org's actual policy.
sla_days:
  Critical: 3
  High: 7
  Medium: 30
  Low: 90

# CIS Controls v8 §7.2 ("Establish and Maintain a Remediation Process") calls for
# prioritizing patching by asset criticality, not severity alone - this multiplies the
# sla_days above by the REMEDIATION TARGET ASSET's risk_tier (see
# remediation/enrichment/risk_scoring.py - a real, disclosed Impact x Likelihood score,
# not a certified assessment), tightening the window for a finding on a Critical-risk
# asset and loosening it for one on a Low-risk asset, even at the same severity. An
# asset with no computed risk_tier (or a tier missing from this map) falls back to 1.0 -
# unchanged from the sla_days value above. Applied to whichever days_remaining/due_date
# is actually shown; the result is rounded to a whole day and floored at 1.
sla_risk_tier_multiplier:
  Critical: 0.5
  High: 0.75
  Medium: 1.0
  Low: 1.25

# A CISA KEV-listed finding (confirmed actively exploited) is escalated straight to
# Critical priority, regardless of any other weight below. This mirrors
# remediation-planner's own hardcoded rule - set enabled: false to disable the override
# and fall back to the weighted score instead.
kev_override:
  enabled: true
  forces_priority: "Critical"

# A finding with an EPSS score at or above this threshold gets escalated to at least
# High priority (never downgraded below what the weighted score alone would produce).
epss_escalation:
  enabled: true
  threshold: 0.5
  forces_priority_at_least: "High"

# Points added to a finding's score based on the criticality of the asset it's on.
# Matched against asset.name (case-insensitive substring) and asset.type - tune the
# keyword list to your own naming convention (this one assumes hostnames like
# WIN-DC01, LNX-AUTH01 encode role in the name, which is common but not universal).
asset_criticality_keywords:
  dc: 3        # domain controller
  auth: 3      # authentication server
  core: 3      # core network infrastructure
  bastion: 2   # jump host / bastion
  db: 2        # database server
  web: 1       # web/application server
  default: 0   # anything not matching a keyword above

asset_type_weights:
  windows-server: 1
  unix-server: 1
  network-routing-switching: 2
  network-security-device: 2
  iot-ot-device: 1
  application: 1
  certificate: 0
  client-application: 1
  windows-endpoint: 1
  mobile-device: 1
  printer: 0
  # Deliberately higher than every other weight above: a compromised hypervisor
  # exposes every VM it hosts, a real blast-radius difference from a single
  # network device or server - not a copy/paste of network-security-device's 2.
  virtualization-host: 3

severity_weights:
  Critical: 3
  High: 2
  Medium: 1
  Low: 0

# Score thresholds that map a finding's total weighted score to a priority tier
# (severity_weight + asset_criticality_keyword + asset_type_weight, before any
# KEV/EPSS override is applied).
priority_thresholds:
  Critical: 6
  High: 4
  Medium: 2
  Low: 0
