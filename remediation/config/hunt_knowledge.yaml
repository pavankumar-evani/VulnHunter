# Hunting knowledge base policy (remediation/hunting/knowledge/). Read fresh on each use.
#
# The catalogs (ATT&CK Enterprise/Mobile/ICS, ATLAS) are generated by scripts/build_hunt_knowledge.py from MITRE's public data; this file only sets how Quanta uses them.
enabled: true                 # false stops the knowledge generator adding suggestions (the library, matrices and reports stay available)
generator:
  max_groups: 6               # threat groups turned into hypotheses per refresh (ranked by how many of your records point at them)
  max_software: 4             # malware families / tools turned into hypotheses per refresh
  max_techniques: 6           # techniques tested by one hypothesis (uncovered ones first; those with ready-made leads preferred)
  recent_hunt_days: 90        # a technique hunted within this many days is not suggested again
  min_estate_overlap: 0       # a group suggested from industry alone needs at least this many of its techniques tagged on your findings or alerts (0 = no minimum)
  use_industry: true          # also suggest groups MITRE documents as targeting `industry` in hunt_engine.yaml
languages: [sigma, splunk-spl, kql, eql]   # the query languages shown in reports and the library
report:
  max_leads: 12               # leads in one report
  default_lookback_days: 30
  max_lookback_days: 180
  keep_versions: 10           # stored versions kept per subject
ai:
  enabled: true               # false refuses every model-assisted draft (the deterministic path is unaffected)
  max_prompt_chars: 6000      # nothing longer is ever sent
  max_drafts_per_subject: 20
