# Module licensing: which API routes belong to which licensable module, the editions the issuing tool offers as shortcuts, and the enforcement defaults.
# See docs/LICENSING.md. The module ids are the eight modules of the sidebar (dashboard/static/js/nav.js) and the All modules page (capabilities.yaml);
# a test keeps the three in step and fails when an API route has no entry here, so a new feature cannot be shipped outside the licence by accident.

# off: nothing is checked (the default, and what a self-hosted evaluation runs as).
# warn: the licence is read and reported (GET /api/license, the All modules page) but nothing is blocked.
# enforce: a route of a module the licence does not cover answers 403.
# Override with QUANTA_LICENSE_MODE. The licence itself comes from QUANTA_LICENSE (the token) or QUANTA_LICENSE_FILE, verified against the vendor public key in
# QUANTA_LICENSE_PUBLIC_KEY_FILE (or remediation/licensing/vendor_public_key.pem when that file is shipped).
mode: off
expiring_days: 30      # report "expiring" this many days before the end date
grace_days: 14         # after the end date the modules keep working for this long (the licence can override it per customer)

# Always available whatever the licence says: signing in, the platform shell, the findings store every module writes into, support, and the administration needed to apply a licence.
core:
  - /api/auth
  - /api/graphs/admin
  - /api/status
  - /api/license
  - /api/features
  - /api/capabilities
  - /api/overview
  - /api/queue
  - /api/findings
  - /api/search
  - /api/notifications
  - /api/support
  - /api/teams
  - /api/assignable-users
  - /api/directory
  - /api/connections
  - /api/simulation
  - /api/api-keys
  - /api/admin
  - /api/export
  - /api/analytics
  - /api/guidance
  - /api/ai-assist
  - /api/ai-trend-analysis
  - /api/priority-rules
  - /api/exploit-criteria
  - /api/alert-rules
  - /api/notification-settings
  - /api/report-schedule
  - /api/asset-policy
  - /api/ingest/findings
  - /api/ingest/scanner-csv
  - /api/ingest/sarif
  - /api/ingest/coverage
  - /api/ingest/generic

# A route belongs to the module whose prefix is its longest match. A prefix under `shared` is available when ANY of the listed modules is licensed.
modules:
