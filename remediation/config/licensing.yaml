    - /api/graphs/soc
    - /api/soc
    - /api/hunting
    - /api/detections
    - /api/soar
    - /api/darkweb
    - /api/threat-intel
    - /api/cortex-xsiam
    - /api/ingest/alerts
    - /api/ingest/threat-intel
    - /api/ingest/darkweb
  appsec:
    - /api/graphs/appsec
    - /api/api-security
    - /api/threat-models
    - /api/quanta-scan
    - /api/ingest/api-traffic
    - /api/ingest/openapi
    - /api/ingest/api-test-results
    - /api/inbound/api-policy-status
  devsecops:
    - /api/graphs/devsecops
    - /api/devsecops
    - /api/applications
    - /api/gitops
    - /api/gate
    - /api/pipeline-gates
    - /api/secure-design
    - /api/dependencies
    - /api/ingest/sbom
    - /api/inbound/pr-status
    - /api/inbound/git-webhook
  infra:
    - /api/graphs/infra
    - /api/tenable
    - /api/qualys
    - /api/openvas
    - /api/infoblox
    - /api/axonius
    - /api/active-directory
    - /api/assets
    - /api/firewall
    - /api/controls
    - /api/zero-day-watch
    - /api/attack-paths
    - /api/quantum-readiness
    - /api/ingest/controls
  ai:
    - /api/graphs/ai
    - /api/ai-security
    - /api/ai-usage
    - /api/ai-vulnerabilities
    - /api/ingest/ai-usage
    - /api/ingest/otlp
  remediation:
    - /api/graphs/remediation
    - /api/remediate
    - /api/remediation-approvals
    - /api/remediation-policy
    - /api/remediation-metrics
    - /api/remediation-verification
    - /api/assignments
    - /api/exceptions
    - /api/run
    - /api/playbooks
    - /api/servicenow
    - /api/jira
    - /api/inbound/ticket-status
  grc:
    - /api/graphs/grc
    - /api/grc
    - /api/cyber-risk
    - /api/ml-insights
    - /api/iam
    - /api/reports
    - /api/activity-log
  admin: []

shared:
  /api/prismacloud: [infra, appsec]
  /api/splunk: [soc, remediation]
  /api/risk: [infra, grc]
  /api/graphs: [soc, appsec, devsecops, infra, ai, remediation, grc]   # the bare prefix; each module's own /api/graphs/<module> entry above is longer, so it decides

# Convenience bundles for the issuing tool (cli/quanta_license.py --edition). They are NOT prices and not the source of truth: a licence lists its modules explicitly.
editions:
  secops: [soc, infra, remediation]
  appsec: [appsec, devsecops, remediation]
  platform: [infra, remediation, grc]
  enterprise: [soc, appsec, devsecops, infra, ai, remediation, grc]
