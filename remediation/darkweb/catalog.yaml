  - {id: torcrawl, name: TorCrawl.py, url: "https://github.com/MikeMeliz/TorCrawl.py", category: crawler, mode: import, how: "Crawl in your isolated environment; import the extracted text."}
  - {id: darc, name: Darc, url: "https://github.com/JarryShaw/darc", category: crawler, mode: import, how: "Run the crawler in your isolated environment; import its exported text or JSON."}
