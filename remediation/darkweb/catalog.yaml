# The dark-web and exposure sources Quanta knows about, and exactly how each one reaches it. Four ways in:
#   feed    Quanta fetches a public clearnet feed on a schedule (nothing about you is sent) and matches it against your watch terms.
#   lookup  Quanta asks a service about your own domain with your key (confirm-gated, or on a schedule once you turn it on). Only the domain is sent.
#   import  A tool or platform produces output; you paste it, or your pipeline posts it to /api/ingest/darkweb (key scope darkweb:write). Quanta never runs these.
#   guide   Not ingested. A directory, search page or piece of infrastructure the analysts use; listed so the whole toolkit is in one place.
# Quanta does not connect to Tor, does not crawl .onion sites, and does not log in to forums or marketplaces. Collection happens in an isolated analyst environment
# you control; Quanta turns what it produces into watch hits, alerts and cases.
sources:
  - {id: ransomwatch, name: Ransomwatch, url: "https://ransomwatch.telemetry.ltd", category: leak-site monitor, mode: feed, active_default: true,
     how: "Active. Quanta reads the project's public posts list (raw.githubusercontent.com/joshhighet/ransomwatch posts.json) and matches victim names against your watch terms. A match raises a High alert and a case. The project is community-run and its list can lag; ransomware.live is polled as a second source."}
  - {id: ransomware-live, name: ransomware.live (companion feed), url: "https://www.ransomware.live", category: leak-site monitor, mode: feed, active_default: true,
     how: "Active. Public API v2 recent victims (api.ransomware.live/v2/recentvictims): victim, group, discovered date, website. Same matching as Ransomwatch."}
  - {id: intelx, name: IntelligenceX, url: "https://intelx.io", category: breach and paste search, mode: lookup, needs: "API key (a free key has limited access)",
     how: "Add the key on Connections (type IntelligenceX). Quanta searches your domains and keeps the count, source bucket, date and a masked identifier per record. Run on demand or switch on the daily schedule."}
  - {id: dehashed, name: DeHashed, url: "https://dehashed.com", category: credential search, mode: lookup, needs: "API key and credits",
     how: "Add the key on Connections (type DeHashed). Query is domain:<yours>. Quanta reads the e-mail or username and database name only; passwords and hashes are dropped in the connector."}
  - {id: leakcheck, name: LeakCheck, url: "https://leakcheck.io", category: credential search, mode: lookup, needs: "API key; domain search needs a plan that includes it",
     how: "Add the key on Connections (type LeakCheck). Same handling: counts, breach names and dates, masked identifiers."}
  - {id: snusbase, name: Snusbase, url: "https://snusbase.com", category: breach compilation search, mode: lookup, needs: "API key (premium)",
     how: "Add the key on Connections (type Snusbase). Searches the _domain field for your domain; keeps database names and masked identifiers."}
  - {id: socradar, name: SOCRadar Dark Web, url: "https://socradar.com/dark-web-monitoring", category: commercial platform, mode: import, needs: "A SOCRadar subscription",
     how: "Export its alerts as JSON or CSV, or have its integration post them to /api/ingest/darkweb. A direct API connector is not built; the platform's own plan decides what it can export."}
  - {id: flare, name: Flare, url: "https://flare.systems", category: commercial platform, mode: import, needs: "A Flare subscription",
     how: "Export events (leaks, Telegram and Discord mentions) as JSON or CSV, or post them to /api/ingest/darkweb. No direct connector is built."}
  - {id: darkfeed, name: DarkFeed, url: "https://darkfeed.io", category: IOC feed, mode: import, needs: "Free tier or subscription",
     how: "Download its indicator export and post it to /api/ingest/darkweb; addresses, domains and hashes are extracted and matched against your terms."}
  - {id: deepdarkcti, name: DeepDarkCTI, url: "https://github.com/fastfire/deepdarkCTI", category: curated source list, mode: import,
     how: "A curated list of sources to monitor. Paste a section into Dark Web Watch > Import to record the sources; use it to decide what your collection tooling should watch. Not a feed of events."}
  - {id: onionsearch, name: OnionSearch, url: "https://github.com/megadose/OnionSearch", category: collection tool, mode: import,
