# Hunt library: one entry per ATT&CK technique Quanta tags. Detections are Sigma-style selections (field|modifier: value) kept deliberately
# generic; translate.py renders them as Splunk SPL for the analyst to run in their own SIEM. Quanta never runs them. Field names follow Sigma's
# process_creation / webserver / authentication conventions and will need mapping to the customer's data model.
T1190:
  hunt: Exploitation of an internet-facing application
  domain: network
  data_sources: [web server access logs, WAF logs, application error logs]
  detections:
    - name: Suspicious request patterns against the affected hosts
      selection: {"cs-uri-query|contains": ["../", "%2e%2e", "${jndi:", "<script", "union select", "cmd=", "/etc/passwd"]}
    - name: Server error bursts from one source
      selection: {"sc-status": [500, 502, 503]}
  notes: Look for the same source IP probing and then receiving a 200 on an unusual path, and for new files or processes on the host in the hour after.
T1059:
  hunt: Command or script interpreters started by an unexpected parent
  domain: endpoint
  data_sources: [process creation (EDR, Sysmon 1, Windows 4688), command-line logging]
  detections:
    - name: Shells spawned by server or office processes
      selection: {"Image|endswith": ["\\cmd.exe", "\\powershell.exe", "/bin/sh", "/bin/bash"], "ParentImage|endswith": ["\\w3wp.exe", "\\httpd.exe", "\\java.exe", "\\spoolsv.exe", "\\winword.exe", "/nginx", "/apache2", "/tomcat"]}
  notes: A web or print service parent starting a shell is rarely legitimate. Check the command line and any network connection that follows.
T1068:
  hunt: Local privilege escalation
  domain: endpoint
  data_sources: [process creation, token and privilege events (Windows 4672, 4673), auditd]
  detections:
    - name: Low-privilege process spawning a SYSTEM or root child
      selection: {"User|contains": ["SYSTEM", "root"], "ParentUser|contains": ["IUSR", "www-data", "apache", "nginx", "NETWORK SERVICE"]}
  notes: Compare against the host's patch state in Quanta; an unpatched host raises the likelihood.
T1548:
  hunt: Abuse of elevation controls
  domain: endpoint
  data_sources: [process creation, sudo and UAC logs]
  detections:
    - name: sudo or UAC bypass patterns
      selection: {"CommandLine|contains": ["sudo -u#-1", "sudoedit", "fodhelper", "eventvwr", "ComputerDefaults"]}
  notes: Review any setuid binary changes and new sudoers entries on the affected hosts.
T1021:
  hunt: Remote service use for lateral movement
  domain: network
  data_sources: [authentication logs (Windows 4624 type 3 or 10), SSH logs, firewall flows]
  detections:
    - name: Remote logons to affected hosts
      selection: {"EventID": 4624, "LogonType": [3, 10]}
  notes: Baseline first. The signal is a new source-destination pair, not the logon itself.
T1210:
  hunt: Exploitation of remote services
  domain: network
  data_sources: [IDS or network detection, service crash logs, process creation]
  detections:
    - name: Inbound connections to commonly exploited service ports
      selection: {"DestinationPort": [445, 135, 3389, 5985, 22, 8080]}
  notes: Look for a service crash or restart within minutes of an unusual inbound connection.
T1552:
  hunt: Unsecured credentials found or used
  domain: identity
  data_sources: [file access auditing, process creation, secrets scanner results]
  detections:
    - name: Reads of credential files and history
      selection: {"CommandLine|contains": [".aws/credentials", ".ssh/id_", ".env", "web.config", "unattend.xml", "history"]}
  notes: Any secret Quanta flagged in code or config should be treated as exposed and rotated; hunt for its use from unusual sources.
T1556:
  hunt: Authentication process tampering
  domain: identity
  data_sources: [authentication logs, registry and PAM config change auditing, domain controller logs]
  detections:
    - name: Changes to authentication modules or policy
      selection: {"TargetObject|contains": ["\\Lsa\\", "\\Authentication Packages"], "CommandLine|contains": ["pam_", "/etc/pam.d"]}
  notes: Compare against change records; unexplained changes on a domain controller are urgent.
T1195:
  hunt: Supply chain compromise
  domain: cloud
  data_sources: [build and CI logs, package install logs, outbound network from build hosts]
  detections:
    - name: Package installs from unexpected registries
      selection: {"CommandLine|contains": ["npm install", "pip install", "--index-url", "curl | sh", "wget -O- |"]}
  notes: Cross-check against the SBOM page for affected packages and versions.
T1499:
  hunt: Endpoint denial of service
  domain: network
  data_sources: [web and network logs, resource metrics]
  detections:
    - name: Throttled or unavailable responses in bursts
      selection: {"sc-status": [429, 503]}
  notes: Check for a pattern that targets the vulnerable endpoint rather than raw volume.
T1600:
  hunt: Weakened encryption
  domain: network
  data_sources: [TLS handshake logs, configuration change auditing]
  detections:
    - name: Downgraded protocol use
      selection: {"tls_version|contains": ["SSLv3", "TLSv1.0", "TLSv1.1"]}
  notes: Look for who changed the configuration and whether clients now negotiate the weaker option.
