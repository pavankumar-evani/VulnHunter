# ATT&CK technique -> tactic(s), for the techniques that most often appear in alerts. Used to put a tactic next to a technique in an investigation
# and to order an attack flow. Written from MITRE ATT&CK (attack.mitre.org); a technique can sit under several tactics and all are listed, the first
# being the one shown. A technique that is not here is shown without a tactic, never with a guessed one. Sub-techniques (T1059.001) use their parent.
