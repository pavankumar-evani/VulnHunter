# Automated dependency version-bump PRs for Quanta's real product dependencies.
#
# Deliberately does NOT cover vulnerable-demo-app/ or vulnerable-demo-multilang/ -
# those directories are intentionally vulnerable, planted fixtures for /quanta-scan to
# scan and demonstrate the pipeline against (see README.md and SECURITY.md). An
# automated PR bumping their pinned-old dependencies would break the demo's purpose,
# not fix a real issue. Note this config only controls automated version-bump PRs -
# it does not affect (and cannot suppress) Dependabot's Security tab alerts, which
# GitHub generates automatically from the dependency graph regardless of this file.
version: 2
updates:
  # The four Python requirements files share pins (ldap3, pyyaml, requests, scikit-learn) and the Dockerfile installs them together in one pip
  # command, so a bump to one file only fails the image build ("ResolutionImpossible"). One entry covers all four directories and one group keeps every
  # bump to the same dependency in the same pull request.
  - package-ecosystem: "pip"
    directories:
      - "/dashboard"
      - "/remediation/config"
      - "/remediation/connectors"
      - "/remediation/enrichment"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
