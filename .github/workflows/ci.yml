name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # The suite is split into balanced shards (scripts/ci_shard.py) that run in parallel; a full serial run had grown past 90 minutes.
    name: Test shard ${{ matrix.shard }} of 4
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout (full history, all branches)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create local tracking branches for all remotes
        # The test suite reads git history via `git show <ref>:<path>` and
        # `git branch --list` for both `master` and the `quanta/auto-fixes-*`
        # branch. actions/checkout only checks out the current ref locally, so
        # every other branch needs a local tracking branch created from the
        # fetched remote refs before the tests can find it.
        run: |
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          for b in $(git branch -r | grep -v '\->' | sed 's#origin/##'); do
            git branch --track "$b" "origin/$b" 2>/dev/null || true
          done

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dashboard dependencies
        run: pip install -r dashboard/requirements.txt

      - name: Install connector dependencies
        run: pip install -r remediation/connectors/requirements.txt

      - name: Install enrichment dependencies
        run: pip install -r remediation/enrichment/requirements.txt

      - name: Install priority-rules engine dependencies
        run: pip install -r remediation/config/requirements.txt

      - name: Run test suite (this shard)
        run: python -m unittest -v $(python scripts/ci_shard.py ${{ matrix.shard }} 4)

  all-tests:
    # One stable check name that is green only when every shard is green.
    name: Run pipeline artifact test suite
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "A test shard failed or was cancelled: ${{ needs.test.result }}"
            exit 1
          fi
