# Scenario: Azure Key Vault mounted straight into the pods by the Secrets Store CSI driver
# (the value never becomes a Kubernetes Secret).
image:
  repository: registry.example.com/quanta
  tag: "1.0.0"
secrets:
  mode: csi
  csi:
    provider: azure
    azure:
      keyvaultName: quanta-prod-kv
      tenantId: "11111111-1111-1111-1111-111111111111"
      clientID: "00000000-0000-0000-0000-000000000000"
serviceAccount:
  annotations: {azure.workload.identity/client-id: "00000000-0000-0000-0000-000000000000"}
  podLabels: {azure.workload.identity/use: "true"}
