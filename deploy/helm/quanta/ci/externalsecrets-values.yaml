# Scenario used by CI (helm lint / template) and as a starting point: Azure Key Vault through the
# External Secrets Operator, workload identity on the service account, ingress with TLS.
image:
  repository: registry.example.com/quanta
  tag: "1.0.0"
config:
  bootstrapAdminEmail: admin@example.com
  smtp: {host: smtp.example.com, port: "587", fromAddress: quanta@example.com}
secrets:
  mode: externalSecrets
  optionalKeys: [QUANTA_ADMIN_PASSWORD, QUANTA_METRICS_TOKEN]
  externalSecrets:
    secretStoreRef: {kind: ClusterSecretStore, name: azure-keyvault}
serviceAccount:
  annotations: {azure.workload.identity/client-id: "00000000-0000-0000-0000-000000000000"}
  podLabels: {azure.workload.identity/use: "true"}
ingress:
  enabled: true
  className: nginx
  host: quanta.example.com
  annotations: {cert-manager.io/cluster-issuer: letsencrypt}
networkPolicy: {enabled: true}
web: {trustForwardedHeaders: true, autoscaling: {enabled: true}}
worker: {autoscaling: {enabled: true}}
persistence: {storageClass: azurefile-csi}
serviceMonitor: {enabled: true, tokenSecretName: quanta-metrics-token}
