{{- if eq .Values.secrets.mode "csi" }}
# The Secrets Store CSI driver mounts these vault objects into the pod as files. The value is
# never stored as a Kubernetes Secret. Each object is written to a file named after the setting
# (the alias), which is what the *_FILE variables point at.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "quanta.spcName" . }}
  labels:
    {{- include "quanta.labels" . | nindent 4 }}
spec:
  provider: {{ .Values.secrets.csi.provider }}
  parameters:
    {{- if eq .Values.secrets.csi.provider "azure" }}
    keyvaultName: {{ .Values.secrets.csi.azure.keyvaultName | quote }}
    tenantId: {{ required "secrets.csi.azure.tenantId is required" .Values.secrets.csi.azure.tenantId | quote }}
    {{- if .Values.secrets.csi.azure.clientID }}
    clientID: {{ .Values.secrets.csi.azure.clientID | quote }}   # Microsoft Entra Workload ID
    {{- else if .Values.secrets.csi.azure.userAssignedIdentityID }}
    useVMManagedIdentity: "true"
    userAssignedIdentityID: {{ .Values.secrets.csi.azure.userAssignedIdentityID | quote }}
    {{- end }}
    objects: |
      array:
        {{- range $key := (include "quanta.secretKeys" . | fromJsonArray) }}
        - |
          objectName: {{ include "quanta.vaultName" (list $ $key) }}
          objectType: secret
          objectAlias: {{ $key }}
        {{- end }}
    {{- else if eq .Values.secrets.csi.provider "aws" }}
    region: {{ .Values.secrets.csi.aws.region | quote }}
    objects: |
      {{- range $key := (include "quanta.secretKeys" . | fromJsonArray) }}
      - objectName: {{ include "quanta.vaultName" (list $ $key) | quote }}
        objectType: secretsmanager
        objectAlias: {{ $key | quote }}
      {{- end }}
    {{- else if eq .Values.secrets.csi.provider "gcp" }}
    secrets: |
      {{- range $key := (include "quanta.secretKeys" . | fromJsonArray) }}
      - resourceName: {{ printf "projects/%s/secrets/%s/versions/latest" $.Values.secrets.csi.gcp.project (include "quanta.vaultName" (list $ $key)) | quote }}
        fileName: {{ $key | quote }}
      {{- end }}
    {{- end }}
    {{- with .Values.secrets.csi.parameters }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
