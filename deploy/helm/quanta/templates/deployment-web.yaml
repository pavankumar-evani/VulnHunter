{{- include "quanta.validate" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quanta.fullname" . }}-web
  labels:
    {{- include "quanta.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  {{- if not .Values.web.autoscaling.enabled }}
  replicas: {{ .Values.web.replicas }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "quanta.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      annotations:
        {{- with .Values.web.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "quanta.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
        {{- with .Values.serviceAccount.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "quanta.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "quanta.podSecurityContext" . | nindent 8 }}
      initContainers:
        {{- include "quanta.initContainers" . | nindent 8 }}
      containers:
        - name: web
          image: {{ include "quanta.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # skip the image's single-container entrypoint: the init container already prepared the release
          command: ["python", "dashboard/app.py"]
          ports:
            - name: http
              containerPort: {{ .Values.web.port }}
          env:
            {{- include "quanta.env" . | nindent 12 }}
            - name: QUANTA_EMBEDDED_WORKER
              value: {{ .Values.web.embeddedWorker | quote }}
            {{- if .Values.web.trustForwardedHeaders }}
            - name: QUANTA_FORWARDED_ALLOW_IPS
              value: "*"
            {{- end }}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          securityContext:
            {{- include "quanta.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            {{- include "quanta.volumeMounts" . | nindent 12 }}
      volumes:
        {{- include "quanta.volumes" . | nindent 8 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "quanta.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: web
      {{- with .Values.web.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
