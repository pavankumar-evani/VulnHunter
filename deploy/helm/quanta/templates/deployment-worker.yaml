{{- if .Values.worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quanta.fullname" . }}-worker
  labels:
    {{- include "quanta.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  {{- if not .Values.worker.autoscaling.enabled }}
  replicas: {{ .Values.worker.replicas }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "quanta.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      annotations:
        {{- with .Values.worker.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "quanta.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
        {{- with .Values.serviceAccount.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "quanta.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "quanta.podSecurityContext" . | nindent 8 }}
      initContainers:
        {{- include "quanta.initContainers" . | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "quanta.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # SIGTERM lets the worker finish the job it is running before it exits, so a rolling update loses no work
          command: ["python", "cli/quanta_admin.py", "worker"]
          env:
            {{- include "quanta.env" . | nindent 12 }}
          # the worker has no port; liveness checks that it can still reach the database and the queue
          livenessProbe:
            exec:
              command: ["python", "cli/quanta_admin.py", "jobs"]
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 20
            failureThreshold: 3
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          securityContext:
            {{- include "quanta.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            {{- include "quanta.volumeMounts" . | nindent 12 }}
      volumes:
        {{- include "quanta.volumes" . | nindent 8 }}
      {{- with .Values.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
