{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "quanta.serviceAccountName" . }}
  labels:
    {{- include "quanta.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The pods need no Kubernetes API access; the vault is reached with this account's cloud identity.
automountServiceAccountToken: false
{{- end }}
