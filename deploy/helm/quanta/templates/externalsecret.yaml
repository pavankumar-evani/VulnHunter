{{- if eq .Values.secrets.mode "externalSecrets" }}
# The External Secrets Operator reads each entry from the key vault (with the cluster's own cloud
# identity, set up in the SecretStore) and keeps the Secret below in sync. No secret value is in
# this chart, the values file or the Helm release.
apiVersion: {{ .Values.secrets.externalSecrets.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ include "quanta.fullname" . }}-secrets
  labels:
    {{- include "quanta.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.secrets.externalSecrets.secretStoreRef.kind }}
    name: {{ .Values.secrets.externalSecrets.secretStoreRef.name }}
  target:
    name: {{ include "quanta.fullname" . }}-secrets
    creationPolicy: Owner
  data:
    {{- range $key := (include "quanta.secretKeys" . | fromJsonArray) }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ include "quanta.vaultName" (list $ $key) }}
    {{- end }}
{{- end }}
