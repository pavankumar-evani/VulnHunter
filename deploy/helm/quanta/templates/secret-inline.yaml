{{- if and (eq .Values.secrets.mode "inline") .Values.secrets.allowInline }}
# DEVELOPMENT ONLY. These values pass through your values file and Helm's release history.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "quanta.fullname" . }}-secrets
  labels:
    {{- include "quanta.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key := (include "quanta.secretKeys" . | fromJsonArray) }}
  {{ $key }}: {{ required (printf "secrets.inline.%s is required in inline mode" $key) (index $.Values.secrets.inline $key) | quote }}
  {{- end }}
{{- end }}
